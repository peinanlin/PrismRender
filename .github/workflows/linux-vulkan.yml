name: Linux Vulkan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-vulkan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SLANG_VERSION: "2026.8.1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            libglfw3-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            ninja-build \
            tar \
            xvfb

      - name: Install pinned Slang SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/slang.tar.gz"
          root="${RUNNER_TEMP}/slang"
          curl --fail --location --retry 3 \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" \
            --output "${archive}"
          mkdir -p "${root}"
          tar -xzf "${archive}" -C "${root}"
          test -f "${root}/include/slang.h"
          test -f "${root}/lib/libslang.so"
          echo "PRISM_SLANG_ROOT=${root}" >> "${GITHUB_ENV}"

      - name: Configure Vulkan-only build
        run: cmake --preset linux-vulkan-debug

      - name: Build
        run: cmake --build --preset linux-vulkan-debug

      - name: Test with Mesa Vulkan
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a ctest --preset linux-vulkan-debug
          --no-tests=error
          --timeout 120

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-vulkan-test-logs
          path: |
            build-linux-vulkan/Testing/Temporary/LastTest.log
            build-linux-vulkan/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
